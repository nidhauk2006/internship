<!DOCTYPE html>
<html>
<head>
    <title>Display Items</title>
</head>
<body>

<h1>Items List</h1>

<button onclick="showItems()">Show Items</button>

<ul id="itemList"></ul>

<script>
    function showItems() {
        let items = ["Apple", "Banana", "Mango", "Orange"];

        let list = document.getElementById("itemList");

        // Clear previous items
        list.innerHTML = "";

        // Loop through array
        items.forEach(function(item) {
            let li = document.createElement("li");
            li.innerText = item;
            list.appendChild(li);
        });
    }
</script>

</body>
</html>
