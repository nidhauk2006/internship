<!DOCTYPE html>
<html>
<head>
    <title>DOM Style Change</title>
</head>
<body>

<p class="text"> DOM Style is the use of JavaScript to change the appearance of HTML elements dynamically. It lets you modify CSS properties like color, size, and background through the DOM, making web pages interactive.
</p>

<button onclick="changeStyle()">Change Style</button>

<script>
    function changeStyle() {
        // Selecting element using querySelector
        let para = document.querySelector(".text");

        // Changing styles
        para.style.color = "darkgreen";
        para.style.backgroundColor = "lightgreen";
        para.style.fontSize = "25px";
    }
</script>

</body>
</html>
