<!DOCTYPE html>
<html>
<head>
    <title>Login Validation</title>
</head>
<body>

<h2>Login Form</h2>

<form id="loginForm">
    <label>Username:</label><br>
    <input type="text" id="username"><br>
    <small id="userError" style="color:red;"></small><br><br>

    <label>Password:</label><br>
    <input type="password" id="password"><br>
    <small id="passError" style="color:red;"></small><br><br>

    <button type="submit">Login</button>
</form>

<p id="success" style="color:green;"></p>

<script>
    let form = document.getElementById("loginForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault(); // prevent page reload

        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        let userError = document.getElementById("userError");
        let passError = document.getElementById("passError");
        let success = document.getElementById("success");

        // Clear previous messages
        userError.innerText = "";
        passError.innerText = "";
        success.innerText = "";

        let isValid = true;

        // Username validation
        if (username === "") {
            userError.innerText = "Username is required";
            isValid = false;
        } else if (username.length < 3) {
            userError.innerText = "Minimum 3 characters required";
            isValid = false;
        }

        // Password validation
        if (password === "") {
            passError.innerText = "Password is required";
            isValid = false;
        } else if (password.length < 4) {
            passError.innerText = "Minimum 4 characters required";
            isValid = false;
        }

        // Success message
        if (isValid) {
            success.innerText = "Login successful!";
        }
    });
</script>

</body>
</html>
