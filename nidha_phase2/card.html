<!DOCTYPE html>
<html>
<head>
    <title>Card Design</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
        }

        .card {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid gray;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            margin-bottom: 15px;
        }

        .card button {
            padding: 10px 15px;
            border: none;
            background-color: darkcyan;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>Card Design Using Box Model</h1>

<div class="card">
    <img src="my_card.jpg.jpeg" width="50%" alt="card image">
    <h2> My Card</h2>
    <p>I designed a card with proper spacing using the CSS box model. It shows how margin, padding, and border are used.</p>
    <button>Click Me</button>
</div>

</body>
</html>
