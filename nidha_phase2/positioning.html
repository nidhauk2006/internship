<!DOCTYPE html>
<html>
<head>
    <title>Positioning</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: black;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .content {
            margin-top: 90px;
            text-align: center;
        }

        .image-container {
            position: relative;
            display: inline-block;
        }

        /* Badge */
        .badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- Fixed Navbar -->
<div class="navbar">
    Fixed Navbar
</div>

<div class="content">
    <h1>Badge on Image</h1>

    <div class="image-container">
        <img src="prdct.jpg" width="230" height="230" alt="Image">
        <div class="badge">New</div>
    </div>
</div>

</body>
</html>
